# See https://pre-commit.com for more information
# To use, run:
# pip install pre-commit
# pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
        exclude: ".*/templates/.*"
      - id: check-toml
  - repo: https://github.com/akaihola/darker
    rev: v2.1.1
    hooks:
      - id: darker
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        # Config in .hadolint.yaml. Only enabled for these images for now.
        files: ^docker/(example-stac-catalog|calrissian-default)/
