name: Calrissian default image Docker Build Test Publish

# Releases (production): version from the top `## <version>` entry of docker/calrissian-default/CHANGELOG.md,
# triggered by pushing the git tag `image-openeo-calrissian-default-v<version>` or by a manual run.
# Pushes to master and pull requests publish test tags (`YYYYMMDD.<run_number>-<branch>`), not meant for production.

on:
  push:
    branches:
      - main
      - master
    paths:
      - "docker/calrissian-default/**"
      - ".github/workflows/calrissian-default-docker-build-test-publish.yml"
    tags:
      - "image-openeo-calrissian-default-v*"
  pull_request:
    paths:
      - "docker/calrissian-default/**"
      - ".github/workflows/calrissian-default-docker-build-test-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openeo-calrissian-default
  IMAGE_DIR: docker/calrissian-default

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          IMAGE_ID="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          CHANGELOG_VERSION=$(sed -n 's/^## \([0-9][0-9.]*\)[[:space:]]*$/\1/p' "${IMAGE_DIR}/CHANGELOG.md" | head -n1)
          if [ -z "$CHANGELOG_VERSION" ]; then
            echo "Cannot read version from ${IMAGE_DIR}/CHANGELOG.md"
            exit 1
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            if [[ "$REF_NAME" =~ ^image-${IMAGE_NAME}-v(.+)$ ]]; then
              TAG_VERSION="${BASH_REMATCH[1]}"
            else
              echo "Invalid release tag: $REF_NAME"
              exit 1
            fi
            if [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
              echo "Tag version $TAG_VERSION != CHANGELOG version $CHANGELOG_VERSION"
              exit 1
            fi
            RELEASE=true
            IMAGE_TAG="$CHANGELOG_VERSION"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE=true
            IMAGE_TAG="$CHANGELOG_VERSION"
          else
            RELEASE=false
            BRANCH=$(printf '%s' "${HEAD_REF:-$REF_NAME}" | tr -c 'A-Za-z0-9_.-' '-')
            IMAGE_TAG="$(date +'%Y%m%d').${RUN_NUMBER}-${BRANCH}"
          fi

          if [ "$RELEASE" = "true" ] && docker manifest inspect "${IMAGE_ID}:${IMAGE_TAG}" > /dev/null 2>&1; then
            echo "Release ${IMAGE_ID}:${IMAGE_TAG} already exists. Add a new version to the CHANGELOG."
            exit 1
          fi

          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_ID}:${IMAGE_TAG} (release: ${RELEASE})" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.IMAGE_DIR }}
          file: ${{ env.IMAGE_DIR }}/Dockerfile
          load: true
          tags: ${{ steps.vars.outputs.image_id }}:${{ steps.vars.outputs.image_tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.vars.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      - name: Smoke test tools
        run: |
          set -euxo pipefail
          docker run --rm "${{ steps.vars.outputs.image_id }}:${{ steps.vars.outputs.image_tag }}" bash -c '
            set -euxo pipefail
            test "$(id -u)" = 1001
            touch "$HOME/write-test"
            sh -c "echo sh ok"
            curl --version
            wget --version
            echo "{\"a\": 1}" | jq -e ".a == 1"
            find --version
            tar --version
            gzip --version
            unzip -v | head -1
          '

      - name: Push image
        run: docker push "${{ steps.vars.outputs.image_id }}:${{ steps.vars.outputs.image_tag }}"
