name: pre-commit

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the actual head commit (not the PR's synthetic merge
          # commit) so the working tree matches --to-ref exactly; darker
          # refuses to write reformatted files otherwise.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --from-ref ${{ github.event.pull_request.base.sha || github.event.before }} --to-ref ${{ github.event.pull_request.head.sha || github.sha }}
